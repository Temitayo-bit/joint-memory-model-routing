<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Vercel, Supabase, and RunPod deployment</title><desc id="desc">The browser loads UI from Vercel but calls Supabase Auth and an authenticated Edge Function directly. Supabase retains RLS-protected memory; RunPod inference is transient.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172033}.z{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.c{stroke:#334155;stroke-width:2}.h{font-size:20px;font-weight:bold}.b{font-size:15px}.s{font-size:13px;fill:#475569}.q{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#g)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#059669"/></marker></defs>
<rect width="1200" height="640" fill="white"/><text x="35" y="42" class="h" font-size="26">Stable web UI, authenticated memory, temporary inference</text>
<rect x="35" y="75" width="210" height="480" class="z"/><text x="50" y="108" class="h">User device</text><rect x="55" y="175" width="170" height="130" class="c" fill="#f1f5f9" rx="12"/><text x="75" y="210" class="h">Browser</text><text x="75" y="240" class="b">request + user JWT</text><text x="55" y="500" class="s">No durable research memory</text>
<rect x="285" y="75" width="190" height="480" class="z"/><text x="300" y="108" class="h">Vercel</text><rect x="305" y="175" width="150" height="130" class="c" fill="#eef2ff" rx="12"/><text x="325" y="210" class="h">Next.js UI</text><text x="325" y="240" class="b">web assets only</text><text x="305" y="500" class="s">No server-side API role</text>
<rect x="515" y="75" width="360" height="480" class="z"/><text x="530" y="108" class="h">Supabase</text><rect x="535" y="155" width="145" height="120" class="c" fill="#ecfdf5" rx="12"/><text x="555" y="190" class="h">Auth</text><text x="555" y="220" class="b">issues JWT</text><rect x="705" y="155" width="145" height="120" class="c" fill="#ecfdf5" rx="12"/><text x="720" y="190" class="h">Edge Function</text><text x="720" y="220" class="b">JWT + CORS + RLS</text><rect x="565" y="360" width="260" height="105" class="c" fill="#ecfdf5" rx="12"/><text x="585" y="397" class="h">Durable memory</text><text x="585" y="425" class="b">user-scoped vectors/data</text><text x="530" y="500" class="s">Free tier may pause after inactivity</text>
<rect x="915" y="75" width="250" height="480" class="z"/><text x="930" y="108" class="h">RunPod</text><rect x="935" y="175" width="210" height="130" class="c" fill="#fff7ed" rx="12"/><text x="955" y="210" class="h">Ephemeral Pod</text><text x="955" y="240" class="b">authenticated model API</text><text x="935" y="500" class="s">Terminate after active use</text>
<path d="M225 210H305" class="q"/><text x="230" y="190" class="s">loads UI</text><path d="M225 135H535" class="q"/><text x="310" y="130" class="s">sign-in / JWT</text><path d="M225 335H705" class="q"/><text x="385" y="330" class="s">direct signed request + JWT</text><path d="M780 275V360" class="q"/><text x="790" y="330" class="s">RLS read/write</text><path d="M850 215H935" class="q"/><text x="855" y="195" class="s">context + token</text><path d="M935 290H850" class="r"/><text x="855" y="320" class="s">answer + timing</text><path d="M705 350H225" class="r"/><text x="375" y="375" class="s">response</text><text x="35" y="600" class="s">Blue: request. Green: response. Public RunPod proxy requires a token/readiness check; a 75-second application budget stays below its 100-second cap.</text>
</svg>
