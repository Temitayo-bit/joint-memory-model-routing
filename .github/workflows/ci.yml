name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — pinned to a reviewed immutable commit for public-repository CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run repository tests
        run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — pinned to a reviewed immutable commit for public-repository CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run repository build gate
        run: make build
